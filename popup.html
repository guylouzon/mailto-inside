<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mailto to Gmail</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    width: 240px;
    padding: 14px;
    font-size: 13px;
    color: #202124;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 10px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  p {
    color: #666666;
    font-size: 12px;
    margin: 10px 0 0;
    line-height: 1.4;
  }
  .switch {
    position: relative;
    width: 36px;
    height: 20px;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.15s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 14px;
    width: 14px;
    left: 3px;
    top: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.15s;
  }
  input:checked + .slider {
    background: #1a73e8;
  }
  input:checked + .slider::before {
    transform: translateX(16px);
  }
</style>
</head>
<body>
  <h1>Mailto to Gmail</h1>
  <div class="row">
    <span>Enabled</span>
    <label class="switch">
      <input type="checkbox" id="enabled-toggle">
      <span class="slider"></span>
    </label>
  </div>
  <p>When on, clicking a mailto: link opens a quick compose form and hands it off to a pre-filled Gmail draft. No account access, nothing leaves your browser.</p>
  <script src="popup.js"></script>
</body>
</html>
